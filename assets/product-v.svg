<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWallV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4d6d1" />
      <stop offset="60%" stop-color="#c3c5bf" />
      <stop offset="100%" stop-color="#a7a9a3" />
    </linearGradient>
    <linearGradient id="pedTopV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f7f4" />
      <stop offset="100%" stop-color="#e6e8e3" />
    </linearGradient>
    <linearGradient id="smokeGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a443c" />
      <stop offset="40%" stop-color="#363028" />
      <stop offset="80%" stop-color="#231e17" />
      <stop offset="100%" stop-color="#14110d" />
    </linearGradient>
    <filter id="shadowV" x="-30%" y="-30%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="17" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.14  0 0 0 0 0.14  0 0 0 0 0.12  0 0 0 0.36 0" />
    </filter>
  </defs>

  <!-- Wall Background -->
  <rect width="600" height="800" fill="url(#bgWallV)" />

  <!-- Cast Pedestal Shadow -->
  <polygon points="190,590 470,720 420,800 160,640" fill="#24241f" filter="url(#shadowV)" />

  <!-- Pedestal -->
  <polygon points="150,500 410,500 410,740 150,740" fill="#cfd1cc" />
  <polygon points="150,500 200,450 460,450 410,500" fill="url(#pedTopV)" />
  <polygon points="410,500 460,450 460,690 410,740" fill="#9da199" />

  <!-- Bottle Cast Shadow -->
  <ellipse cx="320" cy="475" rx="46" ry="14" fill="#24241f" opacity="0.4" />

  <!-- Vesper Slender Smoked Flacon -->
  <g transform="translate(250, 255)">
    <!-- Smoked Glass Body -->
    <rect x="15" y="55" width="85" height="160" fill="url(#smokeGlass)" stroke="#24241f" stroke-width="0.8" />

    <!-- Label -->
    <rect x="25" y="105" width="65" height="50" fill="#e5e5e5" stroke="#24241f" stroke-width="0.5" />
    <text x="57" y="139" font-family="'DM Sans', 'Inter', sans-serif" font-weight="400" font-size="28" fill="#24241f" text-anchor="middle">V</text>
    <text x="57" y="149" font-family="'DM Sans', 'Inter', sans-serif" font-weight="400" font-size="6" fill="#24241f" text-anchor="middle" letter-spacing="1">VESPER</text>

    <!-- Reflections -->
    <line x1="17" y1="56" x2="17" y2="214" stroke="#ffffff" stroke-width="1.6" opacity="0.6" />
    <line x1="97" y1="56" x2="97" y2="214" stroke="#ffffff" stroke-width="0.7" opacity="0.25" />

    <!-- Cap -->
    <rect x="34" y="20" width="47" height="35" fill="#24241f" stroke="#333333" stroke-width="0.5" />
  </g>
</svg>
