<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbddd8" />
      <stop offset="60%" stop-color="#cbcdc8" />
      <stop offset="100%" stop-color="#b4b6b1" />
    </linearGradient>
    <linearGradient id="pedestalTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f6f3" />
      <stop offset="100%" stop-color="#e5e7e2" />
    </linearGradient>
    <linearGradient id="pedestalFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4d6d1" />
      <stop offset="100%" stop-color="#bcbeb9" />
    </linearGradient>
    <linearGradient id="amberT" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#935728" />
      <stop offset="50%" stop-color="#723f18" />
      <stop offset="100%" stop-color="#3d1f08" />
    </linearGradient>
    <filter id="pedShadow" x="-30%" y="-30%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.14  0 0 0 0 0.14  0 0 0 0 0.12  0 0 0 0.35 0" />
    </filter>
  </defs>

  <!-- Wall Background -->
  <rect width="600" height="800" fill="url(#bgWall)" />
  
  <!-- Subtle Wall Texture Line -->
  <line x1="0" y1="280" x2="600" y2="280" stroke="#bcc0ba" stroke-width="0.7" />

  <!-- Cast Pedestal Shadow -->
  <polygon points="210,580 490,710 440,790 180,630" fill="#24241f" filter="url(#pedShadow)" />

  <!-- Pedestal -->
  <polygon points="170,490 430,490 430,730 170,730" fill="url(#pedestalFront)" />
  <polygon points="170,490 220,440 480,440 430,490" fill="url(#pedestalTop)" />
  <polygon points="430,490 480,440 480,680 430,730" fill="#a4a6a1" />

  <!-- Bottle Cast Shadow on Pedestal -->
  <ellipse cx="330" cy="465" rx="45" ry="14" fill="#24241f" opacity="0.4" />
  <polygon points="310,465 420,478 380,448 310,455" fill="#24241f" opacity="0.3" />

  <!-- Bottle Cylinder -->
  <g transform="translate(255, 260)">
    <!-- Glass Body -->
    <rect x="15" y="55" width="80" height="150" fill="#e8eae6" opacity="0.35" stroke="#24241f" stroke-width="0.8" />
    <!-- Liquid Content -->
    <rect x="19" y="82" width="72" height="120" fill="url(#amberT)" opacity="0.9" />
    <ellipse cx="55" cy="82" rx="36" ry="4" fill="#b8783d" />

    <!-- Label -->
    <rect x="23" y="110" width="64" height="48" fill="#e5e5e5" stroke="#24241f" stroke-width="0.5" />
    <text x="55" y="142" font-family="'DM Sans', 'Inter', sans-serif" font-weight="400" font-size="26" fill="#24241f" text-anchor="middle">T</text>
    <text x="55" y="152" font-family="'DM Sans', 'Inter', sans-serif" font-weight="400" font-size="6" fill="#24241f" text-anchor="middle" letter-spacing="1">TERRE NOIRE</text>

    <!-- Glass Highlights -->
    <line x1="18" y1="56" x2="18" y2="204" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />
    <line x1="92" y1="56" x2="92" y2="204" stroke="#ffffff" stroke-width="0.8" opacity="0.4" />

    <!-- Cap -->
    <rect x="33" y="18" width="44" height="38" fill="#24241f" />
    <line x1="34" y1="20" x2="76" y2="20" stroke="#444444" stroke-width="1" />
  </g>
</svg>
