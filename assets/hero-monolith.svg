<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Background Concrete & Plaster Gradient -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfbfba" />
      <stop offset="45%" stop-color="#c8cac5" />
      <stop offset="70%" stop-color="#b6b8b3" />
      <stop offset="100%" stop-color="#9a9b96" />
    </linearGradient>

    <!-- Directional Light Ray -->
    <linearGradient id="lightRay" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#eaece8" stop-opacity="0.55" />
      <stop offset="40%" stop-color="#d9dbd6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#24241f" stop-opacity="0.15" />
    </linearGradient>

    <!-- Plinth Surface Gradients -->
    <linearGradient id="plinthTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f2ef" />
      <stop offset="100%" stop-color="#e2e4df" />
    </linearGradient>
    <linearGradient id="plinthFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dadcd7" />
      <stop offset="100%" stop-color="#bfc1bc" />
    </linearGradient>
    <linearGradient id="plinthSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#888985" />
      <stop offset="100%" stop-color="#555652" />
    </linearGradient>

    <!-- Perfume Flacon Amber Liquid -->
    <linearGradient id="flaconLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a47240" />
      <stop offset="35%" stop-color="#8a5a2c" />
      <stop offset="75%" stop-color="#643d1a" />
      <stop offset="100%" stop-color="#3d220c" />
    </linearGradient>

    <!-- Glass Refraction Highlights -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="90%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7" />
    </linearGradient>

    <!-- Plinth Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.14  0 0 0 0 0.14  0 0 0 0 0.12  0 0 0 0.45 0" />
      <feBlend in="SourceGraphic" in2="blurOut" mode="normal" />
    </filter>

    <filter id="plinthShadow" x="-30%" y="-30%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="28" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.14  0 0 0 0 0.14  0 0 0 0 0.12  0 0 0 0.55 0" />
      <feBlend in="SourceGraphic" in2="blurOut" mode="normal" />
    </filter>
  </defs>

  <!-- Background Wall with subtle architectural paneling -->
  <rect width="1600" height="900" fill="url(#wallGrad)" />
  <polygon points="0,0 850,0 1600,680 0,900" fill="url(#lightRay)" />

  <!-- Wall Joint Line (Architectural concrete seam) -->
  <line x1="0" y1="360" x2="1600" y2="360" stroke="#a7a9a4" stroke-width="1" opacity="0.6" />
  <line x1="1080" y1="0" x2="1080" y2="900" stroke="#a7a9a4" stroke-width="1" opacity="0.4" />

  <!-- Floor Level Horizon -->
  <rect y="640" width="1600" height="260" fill="#939590" />
  <line x1="0" y1="640" x2="1600" y2="640" stroke="#24241f" stroke-width="1" opacity="0.2" />

  <!-- Cast Floor Shadow from Plinth -->
  <polygon points="680,670 1280,790 1440,730 840,645" fill="#24241f" opacity="0.4" filter="url(#plinthShadow)" />

  <!-- The Monolithic Plinth (Museum pedestal) -->
  <!-- Plinth Front Face -->
  <polygon points="700,540 920,540 920,780 700,780" fill="url(#plinthFront)" />
  <!-- Plinth Side Face (In deep shadow) -->
  <polygon points="920,540 1020,490 1020,710 920,780" fill="url(#plinthSide)" />
  <!-- Plinth Top Face -->
  <polygon points="700,540 800,490 1020,490 920,540" fill="url(#plinthTop)" />
  <!-- Plinth Hairline Edge -->
  <polygon points="700,540 920,540 1020,490 800,490" fill="none" stroke="#ffffff" stroke-width="0.75" opacity="0.6" />

  <!-- Cast Bottle Shadow on Plinth Top -->
  <ellipse cx="850" cy="510" rx="35" ry="14" fill="#24241f" opacity="0.5" />
  <polygon points="850,510 980,525 960,495 850,500" fill="#24241f" opacity="0.4" />

  <!-- Perfume Flacon (Glass Object) -->
  <g transform="translate(805, 340)">
    <!-- Shadow of Cap and Bottle -->
    <rect x="25" y="40" width="60" height="135" fill="#24241f" opacity="0.2" filter="url(#softShadow)" />

    <!-- Glass Flacon Body -->
    <rect x="20" y="45" width="70" height="125" fill="#e8eae6" opacity="0.3" stroke="#24241f" stroke-width="0.8" />
    
    <!-- Amber Fragrance Essence Inside -->
    <rect x="24" y="70" width="62" height="96" fill="url(#flaconLiquid)" opacity="0.9" />

    <!-- Liquid Surface Meniscus -->
    <ellipse cx="55" cy="70" rx="31" ry="3" fill="#c48a52" />

    <!-- Internal Dip Tube -->
    <line x1="55" y1="46" x2="55" y2="162" stroke="#e8eae6" stroke-width="1.2" opacity="0.6" />

    <!-- Minimal White Paper Label with Soot Letter U -->
    <rect x="28" y="90" width="54" height="42" fill="#e5e5e5" stroke="#24241f" stroke-width="0.5" />
    <text x="55" y="118" font-family="'DM Sans', 'Inter', sans-serif" font-weight="400" font-size="22" fill="#24241f" text-anchor="middle" letter-spacing="1">Z</text>
    <text x="55" y="126" font-family="'DM Sans', 'Inter', sans-serif" font-weight="400" font-size="5" fill="#24241f" text-anchor="middle" letter-spacing="0.8">ZAVALLA</text>

    <!-- Glass Surface Reflections (Highlights) -->
    <rect x="20" y="45" width="70" height="125" fill="url(#glassReflection)" pointer-events="none" />
    <line x1="22" y1="47" x2="22" y2="167" stroke="#ffffff" stroke-width="1.5" opacity="0.75" />
    <line x1="88" y1="47" x2="88" y2="167" stroke="#ffffff" stroke-width="0.8" opacity="0.4" />

    <!-- Heavy Minimalist Soot Cap -->
    <rect x="36" y="18" width="38" height="28" fill="#24241f" stroke="#333333" stroke-width="0.5" />
    <!-- Cap Chamfer Highlight -->
    <line x1="37" y1="19" x2="73" y2="19" stroke="#555555" stroke-width="1" />
    <line x1="37" y1="19" x2="37" y2="45" stroke="#444444" stroke-width="1" />
  </g>

  <!-- Subtle Atmospheric Grain Vignette Overlay -->
  <rect width="1600" height="900" fill="#24241f" opacity="0.08" />
</svg>
